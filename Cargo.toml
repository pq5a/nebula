[package]
name = "nebula"
version = "0.3.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
# Blocking HTTP client. native-tls uses Windows' built-in TLS (SChannel),
# which keeps the binary small compared with bundling rustls.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
serde_json = "1"
sha2 = "0.10"
native-tls = "0.2"

# Windows DPAPI, used to encrypt the saved account tokens. Already in the lockfile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
